<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confetti Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            min-height: 100vh;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        button {
            background: #ff9500;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #ff8c00;
        }
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Confetti Test</h1>
        <p>Test confetti clearing functionality</p>
        
        <button onclick="triggerConfetti()">Trigger Confetti</button>
        <button onclick="clearConfetti()">Clear Confetti</button>
        <button onclick="testAutoClear()">Test Auto Clear (3s)</button>
        
        <p id="status">Ready to test</p>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <script>
        // Simple confetti test
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        function triggerConfetti() {
            document.getElementById('status').textContent = 'Confetti triggered!';
            
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3'];
            const confettiCount = 100;
            
            for (let i = 0; i < confettiCount; i++) {
                createConfettiPiece(colors[Math.floor(Math.random() * colors.length)]);
            }
        }

        function createConfettiPiece(color) {
            const confetti = {
                x: Math.random() * canvas.width,
                y: -10,
                vx: (Math.random() - 0.5) * 4,
                vy: Math.random() * 3 + 2,
                color: color,
                size: Math.random() * 8 + 4,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 20
            };
            
            animateConfetti(confetti);
        }

        function animateConfetti(confetti) {
            const animate = () => {
                confetti.x += confetti.vx;
                confetti.y += confetti.vy;
                confetti.vy += 0.1; // gravity
                confetti.rotation += confetti.rotationSpeed;
                
                ctx.save();
                ctx.translate(confetti.x, confetti.y);
                ctx.rotate(confetti.rotation * Math.PI / 180);
                ctx.fillStyle = confetti.color;
                ctx.fillRect(-confetti.size/2, -confetti.size/2, confetti.size, confetti.size);
                ctx.restore();
                
                if (confetti.y < canvas.height + 10) {
                    requestAnimationFrame(animate);
                }
            };
            
            animate();
        }

        function clearConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('status').textContent = 'Confetti cleared!';
        }

        function testAutoClear() {
            triggerConfetti();
            document.getElementById('status').textContent = 'Confetti triggered! Auto-clearing in 3 seconds...';
            
            setTimeout(() => {
                clearConfetti();
                document.getElementById('status').textContent = 'Auto-cleared after 3 seconds!';
            }, 3000);
        }
    </script>
</body>
</html>
